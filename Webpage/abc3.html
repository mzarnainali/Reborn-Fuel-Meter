<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Zarnain Dashboard</title>
  <style>
    :root {
      --primary: #0f172a;
      --accent: #3b82f6;
      --background: #f9fafb;
      --card-bg: rgba(255, 255, 255, 0.75);
      --blur: 10px;
      --radius: 16px;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
      --font: 'Inter', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font);
    }

    body {
      background: var(--background);
      padding: 32px 16px;
      color: var(--primary);
      line-height: 1.6;
    }

    .container {
      max-width: 900px;
      margin: auto;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(var(--blur));
      -webkit-backdrop-filter: blur(var(--blur));
      padding: 24px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .title {
      font-size: 1.5rem;
      margin-bottom: 16px;
      color: var(--accent);
      font-weight: 600;
    }

    .data-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px 24px;
    }

    .data-item {
      font-size: 1rem;
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
    }

    input[type="number"] {
      width: 100%;
      padding: 8px;
      margin-top: 6px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #fff;
    }

    button {
      margin-top: 10px;
      padding: 10px 16px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    button:hover {
      background: #2563eb;
    }

    .nav {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 24px;
      justify-content: center;
    }

    .nav a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
    }

    .highlight {
      font-weight: bold;
      color: #111;
      background: #dbeafe;
      padding: 2px 8px;
      border-radius: 6px;
    }

    .error {
      color: #dc2626;
      font-weight: bold;
      padding: 12px;
    }

    @media (max-width: 480px) {
      .data-item {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>

  <div class="container">

    <div class="nav">
      <a href="/dash">Dashboard</a>
      <a href="/json">All Data</a>
      <a href="/datalog">Data Log</a>
      <a href="/export">Export</a>
      <a href="/ota_update">OTA Update</a>
    </div>

    <div class="card">
      <div class="title">Live Vehicle Data</div>
      <div class="data-grid">
        <div class="data-item">Gear: <span id="gear">0</span></div>
        <div class="data-item">Converter Lockup: <span id="con_loc">0</span></div>
        <div class="data-item">RPM: <span id="rpm" class="highlight">0</span></div>
        <div class="data-item">Speed: <span id="speed">0</span></div>
        <div class="data-item">Injector: <span id="inj">0</span></div>
        <div class="data-item">Duty Cycle: <span id="duty_cycle">0</span></div>
        <div class="data-item">L/h: <span id="lph" class="highlight">0</span></div>
        <div class="data-item">Instant Km/L: <span id="kml" class="highlight">0</span></div>
        <div class="data-item">Avg Km/L: <span id="avg_kml">0</span></div>
        <div class="data-item">g Force: <span id="g_force">0</span></div>
        <div class="data-item">VSS1 PULS: <span id="vss1">0</span></div>
      </div>
    </div>

    <div class="card">
      <div class="title">Control Panel</div>
      <div class="data-item">O2 Relay: <span id="relay">0</span></div>

      <label>O2 Value:
        <input type="number" id="o2_val">
        <button onclick="updateO2()">Update O2</button>
      </label>

      <button onclick="relay_on()">Turn On O2</button>
      <button onclick="relay_off()">Turn Off O2</button>

      <label>Speed Calibration (Km/h):
        <input type="number" id="calc_speed">
        <button onclick="updateSpeed()">Update</button>
      </label>

      <label>Fuel Calibration (L/h):
        <input type="number" id="calc_fuel">
        <button onclick="updateFuel()">Update</button>
      </label>

      <label>Speed Calibration (RAW):
        <input type="number" id="calc_speed_raw">
        <button onclick="updateSpeedRAW()">Update</button>
      </label>

      <label>Fuel Calibration (RAW):
        <input type="number" id="calc_fuel_raw">
        <button onclick="updateFuelRAW()">Update</button>
      </label>

      <label>LCD Refresh Rate:
        <input type="number" id="lcd_refresh_rate">
        <button onclick="lcdRefreshRate()">Update</button>
      </label>

      <label>Auto Trip Reset Minutes:
        <input type="number" id="trip_reset_min">
        <button onclick="updateTripResetMin()">Update</button>
      </label>

      <label>Fuel Price:
        <input type="number" id="fuel_price">
        <button onclick="sendCommand('fuel_price')">Update</button>
      </label>

      <button onclick="synchronizeTime()">Synchronize Time</button>
    </div>

    <div class="error">
      <span id="error"></span>
    </div>
  </div>

</body>
</html>
