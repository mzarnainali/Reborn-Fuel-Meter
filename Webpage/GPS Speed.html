<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPS Speed Calculator</title>
</head>
<body>
  <h1>GPS Speed</h1>
  <p id="speed">Calculating...</p>

  <script>
    let lastPosition = null;
    let lastTimestamp = null;

    function calculateSpeed(position, timestamp) {
      if (lastPosition && lastTimestamp) {
        // Calculate distance in meters
        const distance = haversineDistance(
          lastPosition.coords.latitude, lastPosition.coords.longitude,
          position.coords.latitude, position.coords.longitude
        );

        // Calculate time difference in seconds
        const timeDifference = (timestamp - lastTimestamp) / 1000;

        // Calculate speed in meters per second
        const speed = distance / timeDifference;

        // Convert speed to km/h
        const speedKMH = speed * 3.6;

        // Update the HTML element with the calculated speed
        document.getElementById('speed').textContent = `Speed: ${speedKMH.toFixed(2)} km/h`;
      }

      // Update last position and timestamp
      lastPosition = position;
      lastTimestamp = timestamp;
    }

    function haversineDistance(lat1, lon1, lat2, lon2) {
      const R = 6371; // Radius of the Earth in kilometers
      const dLat = deg2rad(lat2 - lat1);
      const dLon = deg2rad(lon2 - lon1);
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) *
        Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      const distance = R * c; // Distance in kilometers
      return distance;
    }

    function deg2rad(deg) {
      return deg * (Math.PI / 180);
    }

    // Get the user's location
    if (navigator.geolocation) {
      navigator.geolocation.watchPosition(
        (position) => {
          const timestamp = new Date().getTime();
          calculateSpeed(position, timestamp);
        },
        (error) => {
          console.error('Error getting location:', error);
        },
        { enableHighAccuracy: true }
      );
    } else {
      console.error('Geolocation is not supported by this browser.');
    }
  </script>
</body>
</html>
